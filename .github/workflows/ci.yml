name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same major as the Docker image (node:24-alpine).
  NODE_VERSION: '24'

jobs:
  checks:
    name: Typecheck, lint, format, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # prisma validate resolves env("DATABASE_URL"); no database is contacted.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm run lint:check
      - run: npm run format:check
      - run: npm test -- --ci

  e2e:
    name: End-to-end tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: emma_commerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d emma_commerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://e2e:e2e@localhost:5432/emma_commerce_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Test-only values with random JWT secrets per run; no repository secrets involved.
      - run: node scripts/write-test-env.js "$DATABASE_URL" redis://localhost:6379/0
      - run: npx prisma migrate deploy
      - name: Migrations match schema.prisma (no drift)
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run test:e2e

  api-schema:
    name: GraphQL schema up to date and no breaking changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Committed schema.gql matches the resolvers
        run: |
          npm run schema:generate
          if ! git diff --exit-code -- schema.gql; then
            echo "schema.gql is stale: run 'npm run schema:generate' and commit the result."
            exit 1
          fi
      # Deprecate before removing (ADR-0012): removing an already-deprecated field passes. An intentional break
      # passes only when a commit in the range says [breaking-api], and must be listed for the frontend.
      - name: No breaking GraphQL changes against the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}:schema.gql" 2>/dev/null; then
            echo "No base schema.gql to compare with."
            exit 0
          fi
          git show "${BASE_SHA}:schema.gql" > "$RUNNER_TEMP/base-schema.gql"
          if npx graphql-inspector diff "$RUNNER_TEMP/base-schema.gql" schema.gql --rule suppressRemovalOfDeprecatedField; then
            exit 0
          fi
          if git log --format=%B "${BASE_SHA}..${HEAD_SHA}" | grep -qF '[breaking-api]'; then
            echo "Breaking changes accepted: a commit in this range is marked [breaking-api]."
            exit 0
          fi
          echo "Breaking GraphQL change. Deprecate first, or mark the commit [breaking-api] and tell the frontend."
          exit 1

  docker:
    name: Docker image build and smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: emma_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smoke -d emma_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t emma-backend:ci .
      - run: docker run --rm --entrypoint npx emma-backend:ci prisma --version
      # PrismaService and the Redis client connect on boot, so both processes need them even for liveness.
      # Dummy, non-secret values that satisfy env validation outside production.
      - name: Smoke environment
        run: |
          cat > "$RUNNER_TEMP/smoke.env" <<'EOF'
          NODE_ENV=development
          DATABASE_URL=postgresql://smoke:smoke@localhost:5432/emma_smoke
          REDIS_HOST=localhost
          JWT_SECRET=ci-smoke-access-secret-0123456789abcdef
          JWT_REFRESH_SECRET=ci-smoke-refresh-secret-0123456789abcdef
          JWT_RESET_SECRET=ci-smoke-reset-secret-0123456789abcdef
          JWT_TOKEN_AUDIENCE=localhost
          JWT_TOKEN_ISSUER=localhost
          GOOGLE_CLIENT_ID=ci-smoke
          GOOGLE_CLIENT_SECRET=ci-smoke
          FACEBOOK_APP_ID=ci-smoke
          FACEBOOK_APP_SECRET=ci-smoke
          PAYSTACK_SECRET_KEY=ci-smoke
          CLOUDINARY_CLOUD_NAME=ci-smoke
          CLOUDINARY_API_KEY=ci-smoke
          CLOUDINARY_API_SECRET=ci-smoke
          EOF
      # The worker's relay reads the outbox table, so the schema must exist before it starts.
      - run: docker run --rm --network host --env-file "$RUNNER_TEMP/smoke.env" emma-backend:ci npx prisma migrate deploy
      - name: Start API and worker containers
        run: |
          docker run -d --name emma-smoke --network host --env-file "$RUNNER_TEMP/smoke.env" emma-backend:ci
          # Host networking: the worker needs its own metrics port next to the API's 9464.
          docker run -d --name emma-smoke-worker --network host --env-file "$RUNNER_TEMP/smoke.env" \
            -e ROLE=worker -e PORT=3001 -e METRICS_PORT=9465 emma-backend:ci
      - name: Wait for API /health/live and worker /health/ready
        run: |
          for url in http://localhost:3000/health/live http://localhost:3001/health/ready; do
            ok=
            for i in $(seq 1 30); do
              if curl -fsS "$url"; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then docker logs emma-smoke; docker logs emma-smoke-worker; exit 1; fi
            echo
          done
      - name: Both serve Prometheus metrics on their METRICS_PORT
        run: |
          curl -fsS http://localhost:9464/metrics | grep -q '^http_request_duration_seconds_count'
          curl -fsS http://localhost:9465/metrics | grep -q '^queue_jobs'
      - name: Both stop cleanly on SIGTERM
        run: |
          for name in emma-smoke emma-smoke-worker; do
            docker stop --time 30 "$name"
            code=$(docker inspect -f '{{.State.ExitCode}}' "$name")
            echo "$name exited with $code"
            [ "$code" = 0 ] || exit 1
          done
      - name: Container logs
        if: always()
        run: |
          docker logs emma-smoke || true
          docker logs emma-smoke-worker || true

  audit:
    name: Production dependency audit (critical, allowlisted)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run audit:prod

  secrets:
    name: Secret scan (gitleaks, new commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The binary rather than gitleaks-action: no licence key if the repo moves to an organisation,
      # and no third-party action code with access to the checkout.
      - name: Install gitleaks
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # Uses .gitleaks.toml and .gitleaksignore from the repo root (docs/roadmap/environments.md).
      - name: Scan the commits in this push or pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch has an all-zero "before" and a force push can drop it: scan the whole history then.
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range="${HEAD_SHA}"
          fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="$range" .

  migrations:
    name: Applied migrations unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Never edit an applied migration (CLAUDE.md): new folders under prisma/migrations are fine, but any change to a
      # folder that already exists at the base commit fails, including a new file inside it.
      - name: Reject changes to existing migration folders
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASELINE: prisma/migrations/20261118160000_baseline
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable base commit; nothing to compare."
            exit 0
          fi
          # The ADR-0017 re-baseline replaced the whole history once; a base from before it has nothing to protect.
          if ! git cat-file -e "${BASE_SHA}:${BASELINE}" 2>/dev/null; then
            echo "Base ${BASE_SHA} predates ${BASELINE}; skipping."
            exit 0
          fi
          existing=$(git ls-tree -d --name-only "$BASE_SHA" prisma/migrations/)
          changed=$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" -- prisma/migrations/ \
            | awk -F/ 'NF > 3 { print $1 "/" $2 "/" $3 }' | sort -u)
          bad=$(comm -12 <(printf '%s\n' "$existing" | sort -u) <(printf '%s\n' "$changed"))
          if [ -n "$bad" ]; then
            echo "These applied migrations were modified or deleted; add a new migration instead:"
            printf '  %s\n' $bad
            exit 1
          fi
          echo "No existing migration folder changed."

  repro:
    name: Audit repro suite (expected to fail until fixes land)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Each failing test is an open audit finding (test/repro/README.md); it turns green when fixed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:repro
