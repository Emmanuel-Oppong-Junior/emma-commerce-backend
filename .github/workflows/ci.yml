name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same major as the Docker image (node:24-alpine).
  NODE_VERSION: '24'

jobs:
  checks:
    name: Typecheck, lint, format, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # prisma validate resolves env("DATABASE_URL"); no database is contacted.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm run lint:check
      - run: npm run format:check
      - run: npx jest --ci

  e2e:
    name: End-to-end tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: emma_commerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d emma_commerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://e2e:e2e@localhost:5432/emma_commerce_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Test-only values with random JWT secrets per run; no repository secrets involved.
      - run: node scripts/write-test-env.js "$DATABASE_URL"
      - run: npx prisma migrate deploy
      - run: npm run test:e2e

  docker:
    name: Docker image build and smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: emma_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smoke -d emma_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t emma-backend:ci .
      - run: docker run --rm --entrypoint npx emma-backend:ci prisma --version
      # PrismaService connects on boot, so the app needs a reachable database even for liveness.
      # Dummy, non-secret values that satisfy env validation outside production.
      - name: Start container
        run: >-
          docker run -d --name emma-smoke --network host
          -e NODE_ENV=development
          -e DATABASE_URL=postgresql://smoke:smoke@localhost:5432/emma_smoke
          -e JWT_SECRET=ci-smoke-access-secret-0123456789abcdef
          -e JWT_REFRESH_SECRET=ci-smoke-refresh-secret-0123456789abcdef
          -e JWT_RESET_SECRET=ci-smoke-reset-secret-0123456789abcdef
          -e JWT_TOKEN_AUDIENCE=localhost
          -e JWT_TOKEN_ISSUER=localhost
          -e GOOGLE_CLIENT_ID=ci-smoke -e GOOGLE_CLIENT_SECRET=ci-smoke
          -e FACEBOOK_APP_ID=ci-smoke -e FACEBOOK_APP_SECRET=ci-smoke
          -e PAYSTACK_SECRET_KEY=ci-smoke
          -e CLOUDINARY_CLOUD_NAME=ci-smoke -e CLOUDINARY_API_KEY=ci-smoke -e CLOUDINARY_API_SECRET=ci-smoke
          emma-backend:ci
      - name: Wait for /health/live
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health/live; then exit 0; fi
            sleep 2
          done
          docker logs emma-smoke
          exit 1
      - name: Container logs
        if: always()
        run: docker logs emma-smoke || true

  audit:
    name: Production dependency audit (critical, allowlisted)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run audit:prod

  secrets:
    name: Secret scan (gitleaks, new commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The binary rather than gitleaks-action: no licence key if the repo moves to an organisation,
      # and no third-party action code with access to the checkout.
      - name: Install gitleaks
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # Uses .gitleaks.toml and .gitleaksignore from the repo root (docs/roadmap/environments.md).
      - name: Scan the commits in this push or pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch has an all-zero "before" and a force push can drop it: scan the whole history then.
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range="${HEAD_SHA}"
          fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="$range" .

  repro:
    name: Audit repro suite (expected to fail until fixes land)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Each failing test is an open audit finding (test/repro/README.md); it turns green when fixed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:repro
