# The local load-test stack (P9-L): API + worker from the repo's Dockerfile, Postgres 16, Redis 7 and a Paystack/Resend
# stub, as its own compose project on its own ports. Started by ops/loadtest/run.sh, which writes the secrets file.
name: emma-load

x-app: &app
  image: ${LOAD_APP_IMAGE:-emma-commerce-load:dev}
  env_file: ../../tmp/loadtest/stack.env
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgresql://load:load@postgres:5432/emma_load
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    LOG_LEVEL: warn
    ALLOWED_ORIGINS: https://shop.loadtest.example.com
    FRONTEND_URL: https://shop.loadtest.example.com
    RESEND_BASE_URL: http://stubs:8080
    RESEND_FROM_EMAIL: shop@loadtest.example.com
    NODE_EXTRA_CA_CERTS: /certs/ca.crt
  extra_hosts:
    - api.paystack.co:10.213.0.10
  volumes:
    - stub-certs:/certs:ro
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    stubs:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: load
      POSTGRES_PASSWORD: load
      POSTGRES_DB: emma_load
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - max_connections=100
      - -c
      - shared_buffers=512MB
      - -c
      - log_min_duration_statement=200
    ports:
      - '5434:5432'
    cpus: 2
    mem_limit: 4g
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U load -d emma_load']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [load]

  redis:
    image: redis:7-alpine
    ports:
      - '6381:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [load]

  stubs:
    build: ./stubs
    image: emma-load-stubs:dev
    environment:
      STUB_PAYSTACK_LATENCY_MS: ${STUB_PAYSTACK_LATENCY_MS:-300}
    volumes:
      - stub-certs:/certs
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      load:
        ipv4_address: 10.213.0.10

  migrate:
    image: ${LOAD_APP_IMAGE:-emma-commerce-load:dev}
    environment:
      DATABASE_URL: postgresql://load:load@postgres:5432/emma_load
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy
    networks: [load]

  api:
    <<: *app
    environment:
      <<: *app-env
      ROLE: api
    ports:
      - '3100:3000'
      - '9465:9464'
    cpus: 2
    mem_limit: 1g
    networks: [load]

  worker:
    <<: *app
    environment:
      <<: *app-env
      ROLE: worker
    cpus: 1
    mem_limit: 768m
    networks: [load]

  k6:
    image: grafana/k6:1.3.0
    profiles: [k6]
    volumes:
      - ./:/loadtest:ro
      - ../../tmp/loadtest:/results
    working_dir: /loadtest
    networks: [load]

volumes:
  pgdata:
  stub-certs:

networks:
  load:
    ipam:
      config:
        - subnet: 10.213.0.0/24
