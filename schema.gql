  """
  assignOrderItemSerials(input: OrderItemSerialsInput!): Order!

  """
  Give a user a staff role, replacing their current one (staff.manage). You may only assign a role whose permissions you all hold; only an Owner assigns or changes an Owner; the last Owner cannot be demoted. Audited.
  """
  assignStaffRole(roleKey: String!, userId: ID!): StaffMember!

  """Cancels the authenticated user's own order and restores stock"""
  cancelOrder(orderId: String!, reason: String): Order!

  """Cancel an OPEN or SUBMITTED stock-take; no stock moves"""
  cancelStockTake(id: ID!, reason: String): StockTake!

  """Cancel a DRAFT transfer; nothing has moved yet (staff)"""
  cancelStockTransfer(id: ID!, input: CancelStockTransferInput): StockTransfer!

  """Change the password of the active user"""
  changeUserPassword(input: ChangeUserPasswordInput!): User!

  """Clears all items from the user’s cart"""
  clearCart: Cart!

  """
  Clear an order's open review flags with a note, returning them. NOT_FOUND when it has none. Staff, audited
