    first: Int! = 50
  ): PriceChangePage!
  product: Product!
  productId: ID!

  """Units held for open orders (staff with inventory.view)"""
  reserved: Int!

  """Stock keeping unit code"""
  sku: String
  weightGrams: Int
  widthMm: Int
}

