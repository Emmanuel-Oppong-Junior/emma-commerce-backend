"""Why stock moved (ADR-0008)"""
enum StockMovementReason {
  """Manual correction with a reason (damage, loss, stock count)"""
  ADJUSTMENT

  """
  Stock the old inventory log did not explain, recorded by the ledger migration
  """
  OPENING_BALANCE

  """Stock received: a delivery, or the opening stock of a new variant"""
  RECEIPT

  """A hold given back because the order was cancelled or expired"""
  RELEASE

  """Units held for an order line; on hand, no longer available"""
  RESERVE

  """
  Goods back on hand: a return restocked, or a paid order cancelled before dispatch
  """
  RETURN_RESTOCK

  """
  A reservation consumed: online payment captured, or a cash-on-delivery order dispatched
  """
  SALE

  """Moved between locations (not used yet)"""
  TRANSFER
}

