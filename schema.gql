"""One tier of a TIERED promotion"""
input PromotionTierInput {
  """Item scopes: least targeted units, counted across lines"""
  minimumQuantity: Int

  """CART: least merchandise total after item promotions"""
  minimumSpend: Decimal

  """
  A percentage, an amount off or a fixed unit price, as tierValueType says
  """
  value: Decimal!
}

"""How a promotion reduces the price"""
enum PromotionType {
  """value comes off each targeted unit, or off the cart (CART scope)"""
  AMOUNT_OFF

  """
  buy buyQuantity targeted units, get getQuantity reward units (the cheapest) value % off, mixing lines (not for CART)
  """
  BXGY

  """
  each targeted unit costs value, never more than its price (not for CART)
  """
  FIXED_PRICE

  """
  the delivery fee is waived (no value) or value comes off it, never below zero; CART scope, optionally per zone
  """
  FREE_SHIPPING

  """value is a percentage, 0 to 100"""
  PERCENT

  """
  the highest tier reached applies as tierValueType: by targeted units across lines (item scopes) or by spend (CART)
  """
  TIERED
}

