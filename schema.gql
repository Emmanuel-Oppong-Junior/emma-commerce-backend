"""
Revenue recognised in a period. A payment counts when it is accepted for its order (online payment settled, or cash collected); a refund counts when it is processed.
"""
type SalesReport {
  """grossRevenue / orderCount"""
  averageOrderValue: Float!

  """
  Payments accepted for orders in the period (order totals incl. shipping, after coupons)
  """
  grossRevenue: Float!

  """
  Item sales (unit price paid x quantity) of the orders paid in the period. grossRevenue = itemSales + shipping fees - coupon discounts.
  """
  itemSales: Float!

  """grossRevenue minus refunds"""
  netRevenue: Float!

  """Orders paid in the period"""
  orderCount: Int!

  """Refunds processed in the period against accepted payments"""
  refunds: Float!
  totalRevenue: Float! @deprecated(reason: "Same value as netRevenue; use netRevenue.")
}

