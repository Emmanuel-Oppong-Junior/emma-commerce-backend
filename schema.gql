  Promotions of one group (per level: item or cart) do not combine; the best saving applies
  """
  stackingGroup: String!
  startsAt: DateTime!

  """
  Ids of the scope's kind (variants, products, categories or brands); empty for CART
  """
  targetIds: [ID!]!

  """TIERED: how each tier value reduces the price"""
  tierValueType: PromotionType

  """TIERED: ascending tiers; empty otherwise"""
  tiers: [PromotionTier!]!
  type: PromotionType!

  """
  Flash sale: units that may be sold at its price across all orders; null for no cap
  """
  unitCap: Int

  """
  Units sold at its price by orders holding a use of it (given back on cancel or expiry before payment)
  """
  unitsUsed: Int!
  updatedAt: DateTime!

  """Orders that may use it, across all customers"""
  usageLimit: Int

  """Orders holding a use of it"""
  usedCount: Int!

  """
  A percentage (PERCENT; BXGY: off each reward unit) or an amount in the store currency; null for TIERED
  """
  value: Decimal
}

"""What a promotion targets"""
enum PromotionScope {
  """Products of chosen brands"""
  BRAND

  """The whole cart, after item promotions (no targets)"""
  CART

  """Products of chosen categories"""
  CATEGORY

  """Every variant of chosen products"""
  PRODUCT

  """Chosen variants (targetIds are variant ids)"""
  SKU
}

"""One tier of a TIERED promotion"""
type PromotionTier {
  """Item scopes: least targeted units, counted across lines"""
  minimumQuantity: Int

  """CART: least merchandise total after item promotions"""
  minimumSpend: Money

  """A percentage, an amount off or a fixed unit price (tierValueType)"""
  value: Decimal!
}

"""One tier of a TIERED promotion"""
input PromotionTierInput {
  """Item scopes: least targeted units, counted across lines"""
  minimumQuantity: Int

  """CART: least merchandise total after item promotions"""
  minimumSpend: Decimal

  """
  A percentage, an amount off or a fixed unit price, as tierValueType says
  """
  value: Decimal!
}

"""How a promotion reduces the price"""
enum PromotionType {
  """value comes off each targeted unit, or off the cart (CART scope)"""
  AMOUNT_OFF

  """
  buy buyQuantity targeted units, get getQuantity reward units (the cheapest) value % off, mixing lines (not for CART)
  """
  BXGY

  """
  each targeted unit costs value, never more than its price (not for CART)
  """
  FIXED_PRICE

  """
  the delivery fee is waived (no value) or value comes off it, never below zero; CART scope, optionally per zone
  """
  FREE_SHIPPING

  """value is a percentage, 0 to 100"""
  PERCENT

  """
  the highest tier reached applies as tierValueType: by targeted units across lines (item scopes) or by spend (CART)
  """
  TIERED
}

"""What other customers may see about a user, e.g. on reviews"""
type PublicProfile {
  """
  First name and last initial, e.g. "Kwame A."
  """
  displayName: String!
}

"""What a customer may see of a promotion"""
type PublicPromotion {
  description: String

  """When it ends; null for open-ended"""
  endsAt: DateTime
  id: ID!
  name: String!
}

