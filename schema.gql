type Order {
  """Product discounts (per line) and the coupon, as placed"""
  adjustments: [OrderAdjustment!]!

  """Contact email for order notifications"""
  contactEmail: String!

  """Contact phone number for delivery coordination"""
  contactPhone: String!
  createdAt: DateTime!
  currency: Currency!

  """
  Product discounts plus the coupon (the negated sum of the adjustments); null on some older orders
  """
  discountTotal: Money

  """Whether the order is for delivery or pickup"""
  fulfillmentType: FulfillmentType!

  """Amount charged: subtotal - discountTotal + shippingTotal"""
  grandTotal: Money!
  id: ID!
  items: [OrderItem!]!

  """Auto-generated sequential order reference number"""
  orderNumber: Int!

  """Payment method chosen at order creation"""
  paymentMethod: OrderPaymentMethod!
  paymentStatus: OrderPaymentStatus

  """Set when fulfillmentType is PICKUP"""
  pickupLocationId: ID

  """Pickup location (name, address, city, state, country) at time of order"""
  pickupLocationSnapshot: JSON

  """
  1 for orders with a full price and tax snapshot; 0 for orders placed before it, whose breakdown may be partly null
  """
  pricingVersion: Int!
  shipments: [Shipment!]!

  """Set when fulfillmentType is DELIVERY"""
  shippingAddressId: ID

  """
  Address at time of order: recipientName, phone, region, street, city, area, landmark, ghanaPostGps, latitude, longitude, zipCode, country. Orders placed before Ghana addresses have state instead of the new fields.
  """
  shippingAddressSnapshot: JSON

  """Shipping charged (0 for pickup); null on some older orders"""
  shippingTotal: Money
  status: OrderStatus!

  """
  Sum of unit list price x quantity, before any discount, tax included; null on some older orders
  """
  subtotal: Money

  """
  Tax included in the line totals; null on orders placed before tax was recorded
  """
  taxTotal: Money

  """Status history (tracking timeline), oldest first"""
  timeline: [OrderStatusEvent!]!
  updatedAt: DateTime!
  user: User
  userId: ID!
}

"""A discount or coupon taken off the order when it was placed"""
type OrderAdjustment {
  """Signed amount: reductions are negative"""
  amount: Money!

  """Coupon code when ordered"""
  code: String
  id: ID!

  """
  The line it applies to (a product discount, already in its unitDiscount); null for a cart or shipping promotion
  """
  orderItemId: ID

  """The discount or coupon it came from"""
  sourceId: ID

  """MERCHANDISE (a line or the cart) or SHIPPING (the fee)"""
  target: OrderAdjustmentTarget!
  type: OrderAdjustmentType!
}

"""What an order adjustment reduces"""
enum OrderAdjustmentTarget {
  """A line (orderItemId set) or the cart; counted in discountTotal"""
  MERCHANDISE

  """
  The delivery fee (a free-shipping promotion); already taken off shippingTotal
  """
  SHIPPING
}

enum OrderAdjustmentType {
  COUPON
  DISCOUNT
}

type OrderItem {
  createdAt: DateTime!
  id: ID!

  """(unitListPrice - unitDiscount) x quantity, tax included"""
