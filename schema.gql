  name: String

  """Replaces the permission list; you must hold each of them"""
  permissions: [String!]
}

"""
Store settings to change; omitted fields keep their value, null clears an optional one
"""
input UpdateStoreSettingsInput {
  """Registered legal name, as printed on receipts"""
  legalName: String

  """Whether product prices already include tax"""
  pricesIncludeTax: Boolean
  supportEmail: String
  supportPhone: String

  """Taxpayer Identification Number (letters, digits, hyphens)"""
  tin: String

  """Name customers see"""
