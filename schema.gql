"""
A promotion taken off a quote line (already in the line's unitDiscount) or off the delivery fee (shippingAdjustments)
"""
type QuoteAdjustment {
  """Signed amount: reductions are negative"""
  amount: Money!
  code: String

  """The discount it comes from"""
  sourceId: ID!
  type: OrderAdjustmentType!
}

"""A cart line's share of an order-level adjustment"""
type QuoteAllocation {
  """Signed share: reductions are negative"""
  amount: Money!
  cartItemId: ID!
}

"""
Units of one cart line that pay the same price. A cart line is one quote line, unless a promotion reduces only some of its units (a flash sale's last units): then it has two or more, the reduced units first
"""
type QuoteLine {
  adjustments: [QuoteAdjustment!]!

  """The cart line it prices; a split cart line has several quote lines"""
  cartItemId: ID!

  """
  unitListPrice comes from one of the customer's B2B price lists (the quantity of the variant reached its minimum)
  """
  fromPriceList: Boolean!

  """(unitListPrice - unitDiscount) x quantity, tax included"""
  lineTotal: Money!

  """Option values, e.g. { size: "M" }"""
  optionValues: JSONObject
  productId: ID!
  productName: String!
  quantity: Int!
  sku: String!
  taxLines: [QuoteTaxLine!]!

  """Item discount taken off one unit"""
  unitDiscount: Money!

  """
  Price of one unit before promotions, tax included: the customer's price-list price or the normal price
  """
  unitListPrice: Money!

  """One unit after its discount, without tax"""
  unitNet: Money!

  """Tax included in one discounted unit"""
  unitTax: Money!
  variantId: ID!
}

"""
An order-level reduction (the coupon), split over the lines by largest remainder
"""
type QuoteOrderAdjustment {
  """Each line's share; the shares add up exactly to amount"""
  allocations: [QuoteAllocation!]!

  """Signed amount: reductions are negative"""
  amount: Money!

  """Coupon code"""
  code: String

  """The coupon it comes from"""
  sourceId: ID!
  type: OrderAdjustmentType!
}

"""A tax included in a quote line"""
type QuoteTaxLine {
  amount: Money!

  """The line amount without tax that the rate applies to"""
  base: Money!
  name: String!

  """Rate as a decimal (e.g., 0.15 for 15%)"""
  rate: Decimal!

  """The tax rate it comes from"""
  taxId: ID!
}

input ReceiveStockTransferInput {
  """Only lines that arrived short; every other line is received in full"""
  lines: [ReceivedTransferLineInput!]
}

input ReceivedTransferLineInput {
  """Required when fewer units arrived than were dispatched"""
  note: String

  """Units that arrived, 0 to the quantity dispatched"""
  receivedQuantity: Int!

  """
  Serial-tracked variants: the units that arrived (one per unit received); the rest of the line is written off
  """
  serials: [String!]
  variantId: ID!
}

input RecordCashRemittanceInput {
  """The cash handed in (0 or more)"""
  amount: Decimal!

  """
  The rider's unremitted collections this cash covers (at most 500); empty for an adjusting entry
  """
  collectionIds: [ID!]!

  """Required when the amount differs from the collections"""
  note: String

  """When the cash was received (default now)"""
  receivedAt: DateTime

  """The rider handing in the cash"""
  riderId: ID!
}

input RecordCodPaymentInput {
  """The cash taken; must equal the order's grandTotal"""
  amount: Decimal!

  """
  When the cash was taken (default now); not in the future nor before dispatch
  """
  collectedAt: DateTime
  orderId: ID!

  """
  The staff member who took the cash (an active account with a store role)
  """
  riderId: ID!
}

input RecordDisputeInput {
  """More than 0, at most the payment amount"""
  amount: Decimal!
  category: String
  evidenceDueAt: DateTime

  """The captured online payment (attempt) disputed"""
  paymentId: ID!

  """The provider's dispute id, when it has one"""
  providerDisputeId: String
  reason: String

  """OPEN (default), AWAITING_EVIDENCE or UNDER_REVIEW"""
  status: DisputeStatus
}

input RecordStockTakeCountsInput {
