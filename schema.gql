  completeMfaSignIn(input: CompleteMfaSignInInput!): AuthEntity!

  """
  Finish enrolment with the first code from the authenticator app. Turns two-factor authentication on and returns 10 single-use recovery codes, shown only this once. Counts as a step-up for this session. Audited.
  """
  confirmMfaEnrollment(code: String!): MfaRecoveryCodes!

  """Creates a new address for the user"""
  createAddress(input: CreateAddressInput!): Address!
  createBrand(input: CreateBrandInput!): Brand!

  """Creates a new category (admin only)"""
  createCategory(input: CreateCategoryInput!): Category!

  """Admin: add a coupon code that unlocks a promotion"""
  createCouponCode(input: CreateCouponCodeInput!): CouponCode!

  """Admin: create a customer group"""
  createCustomerGroup(input: CreateCustomerGroupInput!): CustomerGroup!

  """
  Creates an order from the cart at the price of the checkoutQuote whose quoteHash it is sent; CONFLICT with reason QUOTE_CHANGED if the cart no longer prices to it; FORBIDDEN with reason VELOCITY_LIMIT when too many orders came from the same account, phone number or network in a short time
  """
  createOrder(input: CreateOrderInput!): Order!

  """Create a pickup location (admin only)"""
  createPickupLocation(input: CreatePickupLocationInput!): PickupLocationEntity!

  """Admin: create a price list in the store currency"""
  createPriceList(input: CreatePriceListInput!): PriceList!
  createProduct(createProductInput: CreateProductInput!): Product!

  """Creates a product type, optionally with its attributes (admin only)"""
  createProductType(input: CreateProductTypeInput!): ProductType!

  """Admin: create a promotion"""
  createPromotion(input: CreatePromotionInput!): Promotion!

  """Create a return request for a delivered order"""
  createReturnRequest(input: CreateReturnRequestInput!): ReturnRequestEntity!

  """Creates a review for a product"""
  createReview(input: CreateReviewInput!): Review!

  """Create a shipping zone (admin only)"""
  createShippingZone(input: CreateShippingZoneInput!): ShippingZoneEntity!

  """
