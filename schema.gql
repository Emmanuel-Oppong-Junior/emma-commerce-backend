  """Least number of targeted units (any unit for CART) in the cart"""
  minimumQuantity: Int

  """Least merchandise total the order needs"""
  minimumSpend: Money
  name: String!

  """Orders each customer may use it on"""
  perCustomerLimit: Int

  """
  Breaks ties between equal savings: the lowest number wins, then the oldest
  """
  priority: Int!

  """Only an order that enters one of its coupon codes gets it"""
  requiresCoupon: Boolean!

  """
  BXGY: reward targets, of the scope kind; empty for the targets themselves
  """
  rewardTargetIds: [ID!]!
  scope: PromotionScope!

  """
  FREE_SHIPPING: only for deliveries to these shipping zones; empty for every zone
  """
