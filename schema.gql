type Variant {
  """The promotion behind discountedPrice"""
  appliedPromotion: PublicPromotion

  """
  Units that can be bought now in one order: on hand minus reserved, at the best single location that serves customers (an order is fulfilled from one location)
  """
  available: Int!

  """Barcode (EAN, UPC, GTIN, ...)"""
  barcode: String

  """Price before tax, as entered by an admin"""
  basePrice: Money

  """
  The signed-in customer's B2B price at its minimum quantity (the first of priceTiers); null for a visitor or when none of their price lists prices this variant below its normal price
  """
  customerPrice: VariantPriceTier

  """
  Price of one unit after the best automatic promotion on it (its own, its product, category or brand); null without one. For a signed-in customer it starts from their price-list price when that applies to a single unit (none when the list does not allow promotions) and includes their customer-group and first-order promotions. Checkout may differ: coupons, cart minimums and cart promotions apply there.
  """
  discountedPrice: Money
  heightMm: Int
  id: ID!

  """Image shown for this variant instead of the product images"""
  image: String

  """Inactive variants are archived: kept for history, never sold"""
  isActive: Boolean!
  lengthMm: Int

  """
  Available stock at or below which an inventory.low_stock event is raised (default 5)
  """
  lowStockThreshold: Int

  """
  Units physically in stock at every location, including reserved ones (staff with inventory.view)
  """
  onHand: Int!

  """
  Values for the product type's variant axes, e.g. { size: "M", colour: "Red" }
  """
  optionValues: JSONObject!

  """
  Selling price: basePrice, plus tax when the product is taxable; null only for an unpriced migrated variant
  """
  price: Money

  """
  Price changes of this variant, newest first (staff with catalog.product.read)
  """
  priceHistory(
    """Id of the last price change of the previous page"""
    after: ID

    """1-100"""
    first: Int! = 50
  ): PriceChangePage!

  """
  The signed-in customer's B2B unit prices by quantity, ascending (each from the quantity at which it applies, counting units of this variant only); null for a visitor, empty when no price list applies
  """
  priceTiers: [VariantPriceTier!]
  product: Product!
  productId: ID!

  """Units held for open orders (staff with inventory.view)"""
  reserved: Int!

  """Stock keeping unit code"""
  sku: String

  """Stock at each location, the default first (staff with inventory.view)"""
  stockLevels: [VariantStockLevel!]!
  weightGrams: Int
  widthMm: Int
}

