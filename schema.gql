input UpdateUserInput {
  """Email address"""
  email: String

  """User’s name"""
  name: String

  """
  Phone number: Ghana number as 0XXXXXXXXX, 233XXXXXXXXX, +233XXXXXXXXX or 00233XXXXXXXXX (spaces, dashes, dots and parentheses are ignored); stored as +233XXXXXXXXX. Send null to remove it.
  """
  phoneNumber: String

  """Profile picture URL"""
  profilePicture: String
}

input UpdateVariantInput {
  """Unique barcode (EAN, UPC, GTIN, ...)"""
  barcode: String

  """
  Price before tax, e.g. "29.99"; the selling price adds tax when the product is taxable
  """
  basePrice: Decimal
  heightMm: Int
  id: String!

  """HTTPS image shown for this variant"""
  image: String

  """false archives the variant: kept for history, never sold"""
  isActive: Boolean
  lengthMm: Int

  """Stock level that counts as low (defaults to 5)"""
  lowStockThreshold: Int

  """
  Values for the product type's variant axes, e.g. { "size": "M", "colour": "Red" }; omit for none
  """
  optionValues: JSONObject

  """Why prices change, kept in the price history (max 500 characters)"""
  priceChangeReason: String

  """Unique SKU code; generated when omitted"""
