"""
A promotion taken off a quote line (already in the line's unitDiscount) or off the delivery fee (shippingAdjustments)
"""
type QuoteAdjustment {
  """Signed amount: reductions are negative"""
  amount: Money!
  code: String

  """The discount it comes from"""
  sourceId: ID!
  type: OrderAdjustmentType!
}

"""A cart line's share of an order-level adjustment"""
type QuoteAllocation {
  """Signed share: reductions are negative"""
  amount: Money!
  cartItemId: ID!
}

"""
Units of one cart line that pay the same price. A cart line is one quote line, unless a promotion reduces only some of its units (a flash sale's last units): then it has two or more, the reduced units first
"""
type QuoteLine {
  adjustments: [QuoteAdjustment!]!

  """The cart line it prices; a split cart line has several quote lines"""
  cartItemId: ID!

  """(unitListPrice - unitDiscount) x quantity, tax included"""
  lineTotal: Money!

  """Option values, e.g. { size: "M" }"""
  optionValues: JSONObject
  productId: ID!
  productName: String!
  quantity: Int!
  sku: String!
  taxLines: [QuoteTaxLine!]!

  """Item discount taken off one unit"""
  unitDiscount: Money!

  """Catalogue price of one unit, tax included"""
  unitListPrice: Money!

  """One unit after its discount, without tax"""
  unitNet: Money!

  """Tax included in one discounted unit"""
  unitTax: Money!
  variantId: ID!
}

"""
An order-level reduction (the coupon), split over the lines by largest remainder
"""
type QuoteOrderAdjustment {
  """Each line's share; the shares add up exactly to amount"""
  allocations: [QuoteAllocation!]!

  """Signed amount: reductions are negative"""
  amount: Money!

  """Coupon code"""
  code: String

  """The coupon it comes from"""
  sourceId: ID!
  type: OrderAdjustmentType!
}

"""A tax included in a quote line"""
type QuoteTaxLine {
  amount: Money!

  """The line amount without tax that the rate applies to"""
  base: Money!
  name: String!

  """Rate as a decimal (e.g., 0.15 for 15%)"""
  rate: Decimal!

  """The tax rate it comes from"""
  taxId: ID!
}

