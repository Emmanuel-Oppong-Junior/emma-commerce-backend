}

"""One promotion used by one order (staff view)"""
type Redemption {
  couponCodeId: ID
  createdAt: DateTime!
  customerId: ID!
  id: ID!
  orderId: ID!
  promotionId: ID!
  releasedAt: DateTime
  status: RedemptionStatus!

  """
  Units the order bought at the promotional price (0 for a cart promotion)
  """
  units: Int!
}

type RedemptionPage {
  """Pass the last node id as `after` to read the next page"""
  hasNextPage: Boolean!
  nodes: [Redemption!]!
  totalCount: Int!
}

enum RedemptionStatus {
  """Given back: the order was cancelled or expired before payment"""
  RELEASED

  """Counted against the limits since the order was placed"""
  RESERVED
}

input RefreshTokenInput {
  refreshToken: String!
}

type RefundEntity {
  amount: Money!

  """The payment (attempt) the refund returns money from"""
  attemptId: ID!
  createdAt: DateTime!

  """The staff member who issued it with refundOrder"""
  createdById: ID
  currency: String!

  """Why the last send failed or has an unknown outcome"""
  failureReason: String
  id: ID!

  """The order line units it pays back (empty for amount-only refunds)"""
  lines: [RefundLine!]!
  method: RefundMethod!

  """Internal staff note; never shown to the customer"""
  note: String

  """The refund id Paystack returned"""
  providerRef: String
  reason: RefundReason!

  """Set when the refund belongs to a return request"""
  returnRequestId: ID

  """The part of the amount that returns the order's delivery fee"""
  shippingAmount: Money!
  status: RefundStatusEnum!

  """
  Tax included in the amount, from the order's stored tax lines in proportion; null for orders placed before tax was recorded and for refunds of charges that never paid the order
  """
  taxAmount: Money
  updatedAt: DateTime!
}

type RefundLine {
  """
  What these units were charged: their share of the line total and of the order's cart discounts
  """
  amount: Money!
  id: ID!
  orderItemId: ID!
  quantity: Int!
}

enum RefundMethod {
  """A cash-on-delivery payment: staff handed the cash back and recorded it"""
  CASH

  """Sent back through the payment's provider (Paystack)"""
  PROVIDER
}

input RefundOrderInput {
  """A free amount on top of the lines and the delivery fee"""
  amount: Decimal

  """
  Chosen by the client for this refund (8-100 letters, digits, "-" or "_"). Sending the same key again returns the refund it recorded instead of refunding twice
  """
  idempotencyKey: String!

  """Order line units to refund, at what the order stored for them"""
  lines: [RefundOrderLineInput!]

  """
  Internal note, never shown to the customer; required when reason is OTHER
  """
  note: String
  orderId: ID!
  reason: RefundReason!

  """Also refund the delivery fee the order was charged (once per order)"""
  shipping: Boolean
}

input RefundOrderLineInput {
  orderItemId: ID!
  quantity: Int!
}

"""
Why money was refunded. Staff choose any but RETURN and PAYMENT_NOT_ACCEPTED, which the system sets
"""
enum RefundReason {
  CUSTOMER_REQUEST
  DAMAGED
  DUPLICATE_CHARGE
  NOT_DELIVERED

  """Anything else; a note is required"""
  OTHER

  """
  Set by the system for a charge it could not accept (late, wrong amount or duplicate payment)
  """
  PAYMENT_NOT_ACCEPTED
  PRICE_ADJUSTMENT

  """Set by the returns flow (processRefund)"""
  RETURN
  WRONG_ITEM
}

enum RefundStatusEnum {
  """Refused by the provider; nothing was refunded and it can be sent again"""
  FAILED

  """Recorded, not yet sent to the provider"""
  PENDING

  """Accepted by the provider"""
  PROCESSED

  """
  Claimed and sent; if it stays here the provider outcome is unknown and must be checked in Paystack before any resend
  """
  SENDING
}

input RejectReturnInput {
  adminNote: String
  returnRequestId: ID!
}

input RemovePriceListEntriesInput {
  priceListId: ID!

  """1-200 variant ids"""
  variantIds: [ID!]!
}

input RemoveProductsFromTagDto {
  """List of product IDs to be added to tag"""
  productIds: [ID!] = []
}

input ResetPasswordInput {
  """
  New password: 8-128 characters, with at least one uppercase letter, one lowercase letter, one number and one special character (@$!%*?&_-#); no other characters
  """
  newPassword: String!
  resetToken: String!
}

input RestockVariantInput {
  """
  Where the stock is received; defaults to the location of the return's order, else the default location
  """
  locationId: ID

  """
  Lot-tracked variants only (P4-C.1). A receipt needs the lot number and expiry (in the future); a return restock may name an existing lot, else the units go back into the lots the order's sale drew from
  """
  lot: LotInput
  quantity: Int!

  """
  Why the stock came in; defaults to "Manual restock"
  """
  reason: String

  """
  Goods returned under this return request: recorded as RETURN_RESTOCK instead of RECEIPT
  """
  returnRequestId: ID

  """
  One serial per unit, required when the product tracks serials (and refused otherwise): new serials for a receipt, units sold on the return's order for a return restock
  """
  serials: [String!]
  variantId: ID!
}

type ReturnRequestEntity {
  adminNote: String
  createdAt: DateTime!
  id: ID!
  orderId: ID!
  reason: String!
  refundAmount: Money
  status: ReturnStatusEnum!
  updatedAt: DateTime!
  userId: ID!
}

enum ReturnStatusEnum {
  APPROVED
  PENDING
  REFUNDED
  REFUND_PENDING
  REJECTED
}

type RevenueByCategoryEntity {
  categoryId: ID
  categoryName: String

  """Paid orders containing this category"""
