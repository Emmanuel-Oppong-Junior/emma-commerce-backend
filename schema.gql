  """
  Legacy role: SUPER_ADMIN for an Owner, ADMIN for any other staff role, USER for customers
  """
  role: String! @deprecated(reason: "Use staffRole and permissions; role is kept in step for old clients only")

  """
  Staff role in the store; null for customers (the user themself or user.view)
  """
