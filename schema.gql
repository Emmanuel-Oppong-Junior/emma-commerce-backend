"""What a velocity rule counts"""
enum VelocityEvent {
  ORDER_PLACED
  PAYMENT_FAILED
  PAYMENT_STARTED
}

"""
SOFT lets the action through and flags the order; HARD refuses it (card rules can only flag)
"""
enum VelocityLevel {
  HARD
  SOFT
}

"""A velocity rule and the limits in force for it"""
type VelocityLimitEntity {
  event: VelocityEvent!

  """
  Above this count in the window the action is refused (card rules: flagged HARD)
  """
  hardLimit: Int!

  """
  Whether the code default applies (the store has not set its own limits for the rule)
  """
  isDefault: Boolean!
  rule: VelocityRule!

  """Above this count in the window the order is flagged for review"""
  softLimit: Int!
  subject: VelocitySubject!
  windowSeconds: Int!
}

input VelocityLimitInput {
  """At least softLimit"""
  hardLimit: Int!
  rule: VelocityRule!
  softLimit: Int!
}

"""
A velocity rule: one event counted per subject (customer, phone, IP, card) over a fixed window
"""
enum VelocityRule {
  FAILED_PAYMENTS_PER_CARD_24H
  FAILED_PAYMENTS_PER_CUSTOMER_24H
  ORDERS_PER_CUSTOMER_1H
  ORDERS_PER_CUSTOMER_24H
  ORDERS_PER_IP_1H
  ORDERS_PER_IP_24H
  ORDERS_PER_PHONE_24H
  PAYMENT_ATTEMPTS_PER_CUSTOMER_1H
  PAYMENT_ATTEMPTS_PER_IP_1H
}

"""Who or what a velocity rule counts per"""
enum VelocitySubject {
  CARD
  CUSTOMER
  IP
  PHONE
}

