"""
Changes to a promotion: omitted fields stay as they are, null clears an optional one. targetIds, when given, replaces every target (an empty list clears them); it is required when the scope changes. rewardTargetIds and tiers likewise replace the stored ones when given.
"""
input UpdatePromotionInput {
  buyQuantity: Int

  """Replaces the customer groups; [] opens it to everyone"""
  customerGroupIds: [ID!]
  description: String
  endsAt: DateTime
  exclusive: Boolean
  firstOrderOnly: Boolean
  getQuantity: Int
  isActive: Boolean
  maxApplications: Int
  minimumQuantity: Int
  minimumSpend: Decimal
  name: String
  perCustomerLimit: Int
  priority: Int
  requiresCoupon: Boolean
  rewardTargetIds: [ID!]
  scope: PromotionScope

  """Replaces the shipping zones; [] opens it to every zone"""
  shippingZoneIds: [ID!]
  stackingGroup: String
  startsAt: DateTime
  targetIds: [ID!]
  tierValueType: PromotionType
  tiers: [PromotionTierInput!]
  type: PromotionType

  """May be set below unitsUsed: no more units are then sold"""
  unitCap: Int
  usageLimit: Int

  """null clears it (a TIERED promotion has none)"""
  value: Decimal
}

input UpdateReviewInput {
  comment: String
  id: String!
  productId: String

  """Rate number 1 - 5"""
