  """
  createStaffRole(input: CreateStaffRoleInput!): StaffRole!

  """Create a stock location (staff)"""
  createStockLocation(input: CreateStockLocationInput!): StockLocation!

  """Create a DRAFT transfer between two active locations (staff)"""
  createStockTransfer(input: CreateStockTransferInput!): StockTransfer!

  """Creates a new subcategory (admin only)"""
  createSubCategory(
